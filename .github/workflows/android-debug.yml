name: Build Debug APK

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: debug-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    uses: ./.github/workflows/android-build.yml
    with:
      build_type: debug
    secrets: inherit
